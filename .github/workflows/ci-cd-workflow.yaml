name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  DB_IMAGE: postgres:14   # upstream DB image to mirror into ECR

jobs:

  scan:
    name: Scan (Gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for Gitleaks

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--verbose --redact --exit-code 1"

  code-scan:
    name: Code scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan - vulnerabilities & secrets (blocking)
        uses: aquasecurity/trivy-action@master
        env:
          # Don't reach out to Maven Central / npm to resolve versions —
          # shared runner IPs get 429'd. Built-image scans below stay authoritative.
          TRIVY_OFFLINE_SCAN: "true"
          TRIVY_SKIP_DIRS: "**/target,**/node_modules"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy scan - misconfiguration (advisory)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

  build_scan_push:
    name: Build, scan & push to ECR
    runs-on: ubuntu-latest
    needs: [scan, code-scan]

    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}
      backend_image: ${{ steps.image.outputs.backend }}
      frontend_image: ${{ steps.image.outputs.frontend }}
      db_image: ${{ steps.image.outputs.db }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag (commit SHA)
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compose image references
        id: image
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          echo "backend=${REGISTRY}/${ECR_REPOSITORY}:backend-${{ steps.tag.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${ECR_REPOSITORY}:frontend-${{ steps.tag.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "db=${REGISTRY}/${ECR_REPOSITORY}:db-${DB_IMAGE##*:}" >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      # ---------- Backend ----------
      - name: Build Backend Image
        run: docker build -t "${{ steps.image.outputs.backend }}" ./backend

      - name: Scan Backend Image (Trivy)
        run: trivy image --exit-code 0 --severity HIGH,CRITICAL "${{ steps.image.outputs.backend }}"

      - name: Push Backend Image to ECR
        run: docker push "${{ steps.image.outputs.backend }}"

      # ---------- Frontend ----------
      - name: Build Frontend Image
        run: docker build -t "${{ steps.image.outputs.frontend }}" ./frontend

      - name: Scan Frontend Image (Trivy)
        run: trivy image --exit-code 0 --severity HIGH,CRITICAL "${{ steps.image.outputs.frontend }}"

      - name: Push Frontend Image to ECR
        run: docker push "${{ steps.image.outputs.frontend }}"

      # ---------- Database (mirror upstream image into ECR) ----------
      - name: Pull upstream DB Image
        run: docker pull "${DB_IMAGE}"

      - name: Scan DB Image (Trivy)
        run: trivy image --exit-code 0 --severity HIGH,CRITICAL "${DB_IMAGE}"

      - name: Retag & Push DB Image to ECR
        run: |
          docker tag "${DB_IMAGE}" "${{ steps.image.outputs.db }}"
          docker push "${{ steps.image.outputs.db }}"
